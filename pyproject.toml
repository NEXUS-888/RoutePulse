[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "routepulse"
version = "0.1.0"
description = "RoutePulse — Campus Transport Optimization System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pyyaml>=6.0.0",
    "sse-starlette>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
analytics = [
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "ortools>=9.8.0",
]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.90.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "api*",
    "core*",
    "data*",
    "demand*",
    "detect*",
    "eta*",
    "eval*",
    "optimize*",
    "sim*",
    "validate*",
]

[tool.vercel]
entrypoint = "api.main:app"
